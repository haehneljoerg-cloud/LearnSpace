name: SprachKompass - APK erstellen

on:
  workflow_dispatch:
  push:
    paths:
      - 'SprachKompass_GitHub_APK_Projekt.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Projekt aus ZIP entpacken
        run: |
          test -f SprachKompass_GitHub_APK_Projekt.zip
          mkdir -p app-source
          unzip -q SprachKompass_GitHub_APK_Projekt.zip -d app-source
          test -f app-source/index.html
          test -f app-source/app.js

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-Projekt erzeugen
        working-directory: app-source
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8
          mkdir -p www/icons
          cp index.html app.js sw.js manifest.webmanifest www/
          cp -R icons/. www/icons/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "de.sprachkompass.lernen",
            "appName": "SprachKompass",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Debug-APK bauen
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SprachKompass-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
